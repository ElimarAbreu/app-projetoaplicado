name: SecureOps Lab CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Testes e verificações
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q app.py tests
      - name: Executar testes
        run: python -m pytest -q
  deploy:
    name: Deploy na OCI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Instalar rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          command -v rsync
          rsync --version

      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar SSH e host confiável
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Enviar código para staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          rsync -az --delete --exclude='.git/' --exclude='.env' --exclude='.venv/' --exclude='__pycache__/' --exclude='.pytest_cache/' ./ "${DEPLOY_USER}@${DEPLOY_HOST}:secureops-lab-staging/"
      - name: Instalar versão e reiniciar serviço
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo /usr/local/sbin/deploy-secureops-lab'
